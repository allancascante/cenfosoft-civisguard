name: Build docs PDF and presentation

# Dispara cuando cambia algo en docs/ (excepto los archivos autogenerados),
# el script de consolidacion o el propio workflow.
# El bucle infinito se previene con dos mecanismos:
#   1. El job solo corre si el actor NO es el bot de GitHub Actions.
#   2. El commit del bot incluye [skip ci] en el mensaje.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_docs_pdf.py"
      - ".github/workflows/docs-pdf.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_docs_pdf.py"
      - ".github/workflows/docs-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TeX Live (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-lang-spanish

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build consolidated QMD
        run: python scripts/build_docs_pdf.py

      - name: Render PDF (consolidado.qmd)
        run: |
          cd docs
          quarto render consolidado.qmd --to pdf

      - name: Render HTML presentation (defensa-arquitectura-civisguard.qmd)
        run: |
          cd docs
          quarto render defensa-arquitectura-civisguard.qmd --to revealjs

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: consolidado-pdf
          path: docs/consolidado.pdf
          retention-days: 30

      - name: Upload HTML presentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: defensa-html
          path: docs/defensa-arquitectura-civisguard.html
          retention-days: 30

      - name: Commit PDF, HTML and QMD to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/consolidado.pdf docs/defensa-arquitectura-civisguard.html docs/consolidado.qmd
          if git diff --staged --quiet; then
            echo "Sin cambios en los documentos generados."
          else
            git commit -m "docs: actualizar PDF consolidado y presentaci\u00f3n HTML [skip ci]"
            git push
          fi
